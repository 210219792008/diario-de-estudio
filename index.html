<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diario de Estudios | diario-de-estudio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #f6f6fb;
    color: #2d2d44;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .contenedor { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 28px; font-weight: 800; }
  header p { color: #7a7a8c; margin-top: 6px; }

  /* Tarjeta de racha */
  .racha {
    background: linear-gradient(135deg, #5b3ff5, #6c47ff);
    border-radius: 16px;
    padding: 28px 16px;
    text-align: center;
    color: #fff;
    box-shadow: 0 8px 24px rgba(91, 63, 245, .35);
    margin-bottom: 20px;
  }
  .racha .icono { font-size: 40px; }
  .racha .dias { font-size: 46px; font-weight: 800; line-height: 1.1; }
  .racha .texto { opacity: .9; margin-top: 4px; }

  /* Tarjetas genéricas */
  .tarjeta {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
    margin-bottom: 16px;
  }
  .tarjeta h2 { font-size: 18px; margin-bottom: 14px; }

  .progreso { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .progreso .dato {
    background: #f6f5ff;
    border-radius: 10px;
    padding: 14px 8px;
    text-align: center;
  }
  .progreso .valor { font-size: 22px; font-weight: 800; color: #5b3ff5; }
  .progreso .etiqueta { font-size: 13px; color: #7a7a8c; margin-top: 2px; }

  /* Formulario */
  .campo { margin-bottom: 12px; }
  .campo label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .campo input, .campo textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }
  .campo textarea { resize: vertical; min-height: 60px; }
  button.guardar {
    width: 100%;
    background: #5b3ff5;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button.guardar:hover { background: #4a32d6; }

  /* Lista de sesiones */
  .sesion {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
  }
  .sesion:last-child { border-bottom: none; }
  .sesion .detalle { color: #7a7a8c; font-size: 13px; }
  .sesion .minutos { font-weight: 700; color: #5b3ff5; white-space: nowrap; }
  .sesion .borrar {
    background: none;
    border: none;
    cursor: pointer;
    color: #bbb;
    font-size: 16px;
    margin-left: 8px;
  }
  .sesion .borrar:hover { color: #e2483d; }
  .vacio { color: #b0b0bd; text-align: center; font-size: 14px; padding: 8px 0; }
</style>
</head>
<body>
<main class="contenedor">
  <header>
    <h1>📔 Diario de Estudios</h1>
    <p>Apunta tus sesiones y mira cuántos días seguidos llevas</p>
  </header>

  <section class="racha">
    <div class="icono">🔥</div>
    <div class="dias" id="dias">0</div>
    <div class="texto" id="rachaTexto">Empieza tu racha hoy 💪</div>
  </section>

  <section class="tarjeta">
    <h2>Mi progreso</h2>
    <div class="progreso">
      <div class="dato">
        <div class="valor" id="totalMinutos">0</div>
        <div class="etiqueta">minutos en total</div>
      </div>
      <div class="dato">
        <div class="valor" id="mejorRacha">0</div>
        <div class="etiqueta">mejor racha</div>
      </div>
    </div>
  </section>

  <section class="tarjeta">
    <h2>Nueva sesión</h2>
    <form id="formulario">
      <div class="campo">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" required>
      </div>
      <div class="campo">
        <label for="minutos">Minutos estudiados</label>
        <input type="number" id="minutos" min="1" max="1440" placeholder="Ej: 30" required>
      </div>
      <div class="campo">
        <label for="nota">Nota (opcional)</label>
        <textarea id="nota" placeholder="¿Qué estudiaste hoy?"></textarea>
      </div>
      <button type="submit" class="guardar">+ Guardar sesión</button>
    </form>
  </section>

  <section class="tarjeta">
    <h2>Mis sesiones</h2>
    <div id="lista"><div class="vacio">Aún no hay sesiones registradas</div></div>
  </section>
</main>

<script>
(function () {
  var CLAVE = "diarioEstudios";
  var $ = function (id) { return document.getElementById(id); };

  function hoy() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var dia = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + dia;
  }

  function cargar() {
    try {
      var datos = JSON.parse(localStorage.getItem(CLAVE));
      return Array.isArray(datos) ? datos : [];
    } catch (e) { return []; }
  }

  function guardar(sesiones) {
    localStorage.setItem(CLAVE, JSON.stringify(sesiones));
  }

  function calcularRachas(sesiones) {
    var fechas = {};
    sesiones.forEach(function (s) { fechas[s.fecha] = true; });
    var dias = Object.keys(fechas).sort().reverse();
    var actual = 0;
    if (dias.length) {
      var esperada = hoy();
      if (dias[0] === esperada || dias[0] === ayer(hoy())) {
        var cursor = dias[0];
        actual = 1;
        for (var i = 1; i < dias.length; i++) {
          if (anterior(cursor) === dias[i]) { cursor = dias[i]; actual++; }
          else break;
        }
      }
    }
    var mejor = 0, racha = 0, prev = null;
    var asc = Object.keys(fechas).sort();
    for (var j = 0; j < asc.length; j++) {
      if (prev && anterior(asc[j]) === prev) racha++;
      else racha = 1;
      if (racha > mejor) mejor = racha;
      prev = asc[j];
    }
    return { actual: actual, mejor: mejor };
  }

  function yyyyMmDd(d) {
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var dia = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + dia;
  }

  function anterior(fecha) {
    var p = fecha.split("-");
    var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
    d.setDate(d.getDate() - 1);
    return yyyyMmDd(d);
  }

  function ayer(fecha) { return anterior(fecha); }

  function fmtFecha(fecha) {
    var p = fecha.split("-");
    return p[2] + "/" + p[1];
  }

  function pintar() {
    var sesiones = cargar();
    var rachas = calcularRachas(sesiones);

    $("dias").textContent = rachas.actual;
    $("rachaTexto").textContent = rachas.actual === 0
      ? "Empieza tu racha hoy 💪"
      : (rachas.actual === 1 ? "1 día seguido, ¡sigue así! 🎯" : rachas.actual + " días seguidos, ¡sigue así! 🎯");

    var total = 0;
    sesiones.forEach(function (s) { total += Number(s.minutos) || 0; });
    $("totalMinutos").textContent = total;
    $("mejorRacha").textContent = rachas.mejor;

    var lista = $("lista");
    if (!sesiones.length) {
      lista.innerHTML = '<div class="vacio">Aún no hay sesiones registradas</div>';
      return;
    }
    lista.innerHTML = "";
    sesiones
      .slice()
      .sort(function (a, b) { return b.fecha < a.fecha ? -1 : b.fecha > a.fecha ? 1 : 0; })
      .forEach(function (s, i) {
        var fila = document.createElement("div");
        fila.className = "sesion";
        var izq = document.createElement("div");
        izq.innerHTML = "<div><strong>" + fmtFecha(s.fecha) + "</strong> <span class='detalle'>" +
          (s.nota ? "· " + s.nota : "") + "</span></div>";
        var der = document.createElement("div");
        der.innerHTML = "<span class='minutos'>" + s.minutos + " min</span>" +
          "<button class='borrar' title='Eliminar' data-i='" + i + "'>&times;</button>";
        fila.appendChild(izq);
        fila.appendChild(der);
        der.querySelector(".borrar").addEventListener("click", function () {
          var datos = cargar();
          var idx = sesiones
            .map(function (x) { return x.fecha + "|" + x.minutos + "|" + (x.nota || ""); })
            .indexOf(s.fecha + "|" + s.minutos + "|" + (s.nota || ""));
          if (idx > -1) { datos.splice(idx, 1); guardar(datos); pintar(); }
        });
        lista.appendChild(fila);
      });
  }

  $("fecha").value = hoy();
  $("formulario").addEventListener("submit", function (e) {
    e.preventDefault();
    var sesiones = cargar();
    sesiones.push({
      fecha: $("fecha").value,
      minutos: parseInt($("minutos").value, 10) || 0,
      nota: $("nota").value.trim()
    });
    guardar(sesiones);
    $("minutos").value = "";
    $("nota").value = "";
    pintar();
  });

  pintar();
})();
</script>
</body>
</html>
